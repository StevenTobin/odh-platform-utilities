name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)
              echo "Error: Unsupported release tag '$TAG'"
              exit 1
              ;;
          esac
          SEMVER_NUM='(0|[1-9][0-9]*)'
          SEMVER_NON_NUM='[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*'
          SEMVER_IDENTIFIER="($SEMVER_NUM|$SEMVER_NON_NUM)"
          SEMVER_REGEX="^${SEMVER_NUM}\\.${SEMVER_NUM}\\.${SEMVER_NUM}(-${SEMVER_IDENTIFIER}(\\.${SEMVER_IDENTIFIER})*)?$"
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "Error: Tag '$TAG' does not contain a valid semver version (X.Y.Z[-prerelease])"
            exit 1
          fi

      - name: Test product module
        run: make test

      - name: Test flakiness tool module
        run: make -C flakiness test

      - name: Generate release notes
        id: release-notes
        run: bash .github/scripts/generate-release-notes.sh "${GITHUB_REF#refs/tags/}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: ${{ steps.release-notes.outputs.body_path }}
          make_latest: true
